<!-- Favicon: el radar de 9 ejes (uno por Dominio), el mismo motivo que dibujan
     los iconos de la PWA (scripts/generar-iconos.py) y que la app usa en la
     lista de personas y en el detalle. Antes había aquí un rayo morado que
     venía del andamiaje inicial y no tenía nada que ver con el proyecto.

     Va a mano en SVG y no como PNG del script porque un favicon se pide a
     cualquier tamaño y conviene que sea vectorial; a cambio hay que tocar los
     dos si cambia el diseño.

     Tres diferencias deliberadas con los PNG, todas por el tamaño al que esto
     se ve de verdad (16px en la pestaña), comprobadas rasterizando a 16/24/32:
       - Solo el anillo exterior. Los tres anillos concéntricos se empastan en
         una mancha gris a 16px; el de fuera basta para hacer de marco.
       - Sin puntos en los vértices. En los PNG dan peso, pero aquí el punto y
         el trazo se funden y engordan el contorno hasta volverlo un borrón.
       - Trazo del perfil bastante más grueso en proporción: es lo único que
         sigue leyéndose a 16px cuando el resto se pierde.

     Colores del tema oscuro (src/index.css), fijos a propósito: la pestaña del
     navegador no hereda el tema de la app, así que el fondo va incrustado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#16171d"/>

  <!-- Los 9 ejes. Debajo de todo y muy tenues: a tamaño pequeño solo aportan
       la textura de "radar", no se leen uno a uno. -->
  <g stroke="#3c3e4c" stroke-width="1" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="6"/>
    <line x1="32" y1="32" x2="48.71" y2="12.08"/>
    <line x1="32" y1="32" x2="57.61" y2="27.49"/>
    <line x1="32" y1="32" x2="54.52" y2="45"/>
    <line x1="32" y1="32" x2="40.89" y2="56.43"/>
    <line x1="32" y1="32" x2="23.11" y2="56.43"/>
    <line x1="32" y1="32" x2="9.48" y2="45"/>
    <line x1="32" y1="32" x2="6.39" y2="27.49"/>
    <line x1="32" y1="32" x2="15.29" y2="12.08"/>
  </g>

  <!-- Anillo exterior (capa central): el marco del radar. -->
  <polygon
    points="32,6 48.71,12.08 57.61,27.49 54.52,45 40.89,56.43 23.11,56.43 9.48,45 6.39,27.49 15.29,12.08"
    fill="none" stroke="#3c3e4c" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- El perfil. Mismas intensidades que generar-iconos.py ([3,2,3,1,2,3,2,1,2]):
       irregular a propósito, un polígono regular parecería un engranaje y no
       el perfil de alguien. -->
  <polygon
    points="32,6 43.14,18.72 57.61,27.49 39.51,36.33 37.93,48.29 23.11,56.43 16.99,40.67 23.46,30.5 20.86,18.72"
    fill="#c084fc" fill-opacity="0.3"
    stroke="#c084fc" stroke-width="3" stroke-linejoin="round"/>
</svg>
